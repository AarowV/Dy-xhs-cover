<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    资源都用相对路径。这里再写一次 <base>，这样站点挂在
    /Dy-xhs-cover/ 这种子路径下（GitHub Pages）时，css/ 和 js/ 仍然找得到。
    本地双击 index.html、或从网站根目录打开，算出来的目录就是当前这一页所在的目录。
  -->
  <script>
    (function () {
      var path = location.pathname || "/";
      var last = path.split("/").pop();
      if (!path.endsWith("/")) {
        path = last.indexOf(".") === -1 ? path + "/" : path.slice(0, path.lastIndexOf("/") + 1);
      }
      var base = document.createElement("base");
      base.href = path;
      document.head.appendChild(base);
    })();
  </script>
  <title>大字封面</title>
  <meta name="description" content="在浏览器里做小红书和抖音大字封面。选模板、改字、导出 PNG。不上传、不登录。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/templates.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="seal" aria-hidden="true">封</div>
      <div>
        <h1>大字封面</h1>
        <p>小红书 / 抖音封面，在这台电脑上生成，不上传</p>
      </div>
    </div>
    <div class="size-switch" role="group" aria-label="画布尺寸">
      <button type="button" data-size="xhs">小红书 3:4<small>1080 × 1440</small></button>
      <button type="button" data-size="dy">抖音 9:16<small>1080 × 1920</small></button>
    </div>
  </header>

  <main class="app">
    <aside class="panel">
      <div class="panel-scroll">
        <section class="group">
          <h2>模板</h2>
          <div class="tpl-grid" id="tplGrid" role="listbox" aria-label="封面模板"></div>
        </section>

        <section class="group">
          <div class="group-head">
            <h2>文案</h2>
            <button type="button" class="text-btn" id="useSample">填入示例</button>
          </div>
          <label class="field">
            <span>主标题</span>
            <textarea id="title" rows="3" maxlength="80" spellcheck="false" placeholder="一个人也能做出爆款封面"></textarea>
          </label>
          <p class="hint" id="titleCount"></p>
          <label class="field">
            <span>高亮词</span>
            <input id="keyword" type="text" maxlength="16" spellcheck="false" placeholder="爆款">
          </label>
          <p class="hint" id="kwHint"></p>
          <label class="switch">
            <input id="highlight" type="checkbox" checked>
            <span>在标题里高亮这个词</span>
          </label>
          <label class="field">
            <span>副标题（可以空着）</span>
            <textarea id="subtitle" rows="2" maxlength="80" spellcheck="false" placeholder="补一句让人愿意看下去的话"></textarea>
          </label>
          <label class="field">
            <span>角标（可以空着）</span>
            <input id="tag" type="text" maxlength="8" spellcheck="false" placeholder="教程">
          </label>
        </section>

        <section class="group">
          <h2>颜色</h2>
          <div class="colors">
            <label>背景
              <input id="bg" type="color" value="#f4f1ea" aria-label="背景色">
              <em id="bgHex">#f4f1ea</em>
            </label>
            <label>文字
              <input id="fg" type="color" value="#1a1a1a" aria-label="文字色">
              <em id="fgHex">#1a1a1a</em>
            </label>
            <label>强调
              <input id="accent" type="color" value="#ffe14a" aria-label="强调色">
              <em id="accentHex">#ffe14a</em>
            </label>
          </div>
          <div class="presets" id="presets"></div>
        </section>

        <section class="group">
          <h2>背景图</h2>
          <div class="img-row">
            <label class="file-btn">选择图片
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            </label>
            <button type="button" class="ghost-btn" id="clearImg" hidden>移除</button>
          </div>
          <div class="thumb" id="thumb" hidden></div>
          <label class="slider-row" id="scrimWrap" hidden>
            <span id="scrimText">图片变暗 42%</span>
            <input id="scrim" type="range" min="0" max="70" value="42">
          </label>
          <p class="hint">也可以把图片拖到右侧预览上。图片不会离开这台电脑。</p>
        </section>
      </div>

      <div class="panel-foot">
        <button type="button" class="export" id="exportBtn">下载 PNG</button>
        <p class="export-meta" id="exportMeta">小红书 3:4 · 1080 × 1440 像素</p>
        <p class="msg" id="msg" role="status"></p>
      </div>
    </aside>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="scaler" id="scaler">
          <div class="artboard" id="artboard" aria-label="封面预览"></div>
        </div>
      </div>
      <p class="caption" id="caption"></p>
    </div>
  </main>

  <script src="js/fonts.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
